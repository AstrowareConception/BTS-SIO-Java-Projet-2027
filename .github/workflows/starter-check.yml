name: Starter Java check

on:
  push:
    paths:
      - "starter-kit/**"
      - ".github/workflows/starter-check.yml"
  pull_request:
    paths:
      - "starter-kit/**"
      - ".github/workflows/starter-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter-kit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate Maven model
        run: mvn -B validate

      - name: Compile and test
        run: mvn -B test
